<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Marketplace | Escape the Matrix</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Recharts -->
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    // Safe extraction of Recharts components
    const RechartsObj = window.Recharts || {};
    const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = RechartsObj;

    const GEMINI_API_KEY = ""; 
    const WEATHER_API_KEY = ""; 

    const analyticsData = [
      { name: 'Escape the Matrix', sellVolume: 185, buyDemand: 210 },
      { name: 'Product 1', sellVolume: 120, buyDemand: 150 },
      { name: 'Product 2', sellVolume: 98, buyDemand: 130 },
      { name: 'Product 3', sellVolume: 86, buyDemand: 110 },
      { name: 'Product 4', sellVolume: 72, buyDemand: 95 }
    ];

    const initialListings = [
      { id: '1', title: 'Escape the Matrix', description: 'Ultimate campus survival & productivity guide book for university students looking to excel.', price: 19.99, category: 'Textbooks', status: 'available', image_url: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=500' },
      { id: '2', title: 'Product 1', description: 'High-performance noise-canceling campus studio headphones.', price: 49.99, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500' },
      { id: '3', title: 'Product 2', description: 'Complete chemistry lab coat and safety goggles combo set.', price: 15.00, category: 'Lab Supplies', status: 'sold', image_url: 'https://images.unsplash.com/photo-1582719508461-905c673771fd?w=500' },
      { id: '4', title: 'Product 3', description: 'Ergonomic metal desk organizer and study stationery holder.', price: 12.50, category: 'Essentials', status: 'available', image_url: 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=500' },
      { id: '5', title: 'Product 4', description: 'Advanced scientific graphing calculator with high battery life.', price: 55.00, category: 'Electronics', status: 'available', image_url: 'https://images.unsplash.com/photo-1611117775350-ac3950990985?w=500' },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('explore');
      const [listings, setListings] = useState(initialListings);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [wishlist, setWishlist] = useState([]);
      const [time, setTime] = useState('');
      const [weather, setWeather] = useState(null);

      const [showModal, setShowModal] = useState(false);
      const [formTitle, setFormTitle] = useState('');
      const [formCategory, setFormCategory] = useState('Textbooks');
      const [formPrice, setFormPrice] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        const updateTime = () => setTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        updateTime();
        const timer = setInterval(updateTime, 1000);

        const fetchWeather = async () => {
          try {
            if (!WEATHER_API_KEY) {
              setWeather({ temp: 24, condition: 'Sunny' });
              return;
            }
            const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=Bengaluru&units=metric&appid=${WEATHER_API_KEY}`);
            const data = await res.json();
            if (data.main) {
              setWeather({ temp: Math.round(data.main.temp), condition: data.weather[0].main });
            }
          } catch {
            setWeather({ temp: 24, condition: 'Sunny' });
          }
        };

        fetchWeather();
        return () => clearInterval(timer);
      }, []);

      const handleGenerateAI = async () => {
        if (!formTitle) return alert('Please enter a product title first!');
        setIsGenerating(true);
        try {
          if (!GEMINI_API_KEY) {
            setTimeout(() => {
              setFormDesc(`Pristine condition ${formTitle} under ${formCategory}. Essential for campus students looking to succeed!`);
              setIsGenerating(false);
            }, 800);
            return;
          }

          const prompt = `Write a compelling, concise 3-sentence marketplace description for a college student selling "${formTitle}" in the category "${formCategory}". Highlight condition and campus usefulness.`;
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await res.json();
          const generatedText = data?.candidates?.[0]?.content?.parts?.[0]?.text || `High quality ${formTitle} available for students!`;
          setFormDesc(generatedText);
        } catch {
          alert('Failed to generate description.');
        } finally {
          setIsGenerating(false);
        }
      };

      const handleAddListing = (e) => {
        e.preventDefault();
        const newListing = {
          id: Date.now().toString(),
          title: formTitle,
          category: formCategory,
          price: parseFloat(formPrice),
          description: formDesc,
          status: 'available',
          image_url: 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500'
        };
        setListings([newListing, ...listings]);
        setShowModal(false);
        setFormTitle('');
        setFormPrice('');
        setFormDesc('');
      };

      const toggleStatus = (id) => {
        setListings(listings.map(item => item.id === id ? { ...item, status: item.status === 'available' ? 'sold' : 'available' } : item));
      };

      const toggleWishlist = (id) => {
        setWishlist(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);
      };

      const filteredListings = listings.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || item.description.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
        const matchesWishlist = activeTab === 'wishlist' ? wishlist.includes(item.id) : true;
        return matchesSearch && matchesCategory && matchesWishlist;
      });

      return (
        <div className="min-h-screen flex flex-col">
          <header className="sticky top-0 z-40 bg-slate-900 text-white shadow-md border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('explore')}>
                <i data-lucide="shield-check" className="w-7 h-7 text-indigo-400"></i>
                <span className="font-bold text-xl tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                  Campus Market
                </span>
              </div>

              <div className="hidden md:flex items-center gap-6 bg-slate-800/80 backdrop-blur px-4 py-1.5 rounded-full border border-slate-700 text-xs font-medium">
                <div className="flex items-center gap-1.5 text-indigo-300">
                  <i data-lucide="clock" className="w-3.5 h-3.5"></i>
                  <span>{time || '00:00:00 AM'}</span>
                </div>
                <div className="h-3 w-px bg-slate-700"></div>
                <div className="flex items-center gap-1.5 text-amber-300">
                  <i data-lucide="sun" className="w-3.5 h-3.5"></i>
                  <span>{weather ? `${weather.temp}°C, ${weather.condition}` : 'Loading...'}</span>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={() => setActiveTab('explore')}
                  className={`px-3 py-1.5 rounded-lg text-sm font-medium transition ${activeTab === 'explore' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                >
                  Explore
                </button>
                <button
                  onClick={() => setActiveTab('analytics')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition ${activeTab === 'analytics' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                >
                  <i data-lucide="bar-chart-3" className="w-4 h-4"></i>
                  <span className="hidden sm:inline">Analytics</span>
                </button>
                <button
                  onClick={() => setActiveTab('wishlist')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition ${activeTab === 'wishlist' ? 'bg-indigo-600 text-white' : 'hover:bg-slate-800 text-slate-300'}`}
                >
                  <i data-lucide="heart" className="w-4 h-4 text-rose-400"></i>
                  <span className="hidden sm:inline">Wishlist ({wishlist.length})</span>
                </button>
              </div>
            </div>
          </header>

          {activeTab === 'analytics' ? (
            <div className="p-6 max-w-7xl mx-auto space-y-8 w-full flex-1">
              <div>
                <h2 className="text-2xl font-bold text-slate-900">Campus Marketplace Analytics</h2>
                <p className="text-slate-500 text-sm">Real-time analytical graphs comparing top 5 sold and top 5 demanded products.</p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                  <h3 className="text-lg font-semibold text-slate-800 mb-4">🔥 Top 5 Most Sold Products</h3>
                  <div className="h-72 w-full">
                    {BarChart ? (
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={analyticsData}>
                          <CartesianGrid strokeDasharray="3 3" vertical={false} />
                          <XAxis dataKey="name" stroke="#64748b" tick={{fontSize: 11}} />
                          <YAxis stroke="#64748b" />
                          <Tooltip />
                          <Bar dataKey="sellVolume" fill="#6366f1" radius={[4, 4, 0, 0]} name="Units Sold" />
                        </BarChart>
                      </ResponsiveContainer>
                    ) : <p className="text-slate-400">Loading charts...</p>}
                  </div>
                </div>

                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                  <h3 className="text-lg font-semibold text-slate-800 mb-4">📈 Top 5 Highest Demanded / Bought Products</h3>
                  <div className="h-72 w-full">
                    {BarChart ? (
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={analyticsData}>
                          <CartesianGrid strokeDasharray="3 3" vertical={false} />
                          <XAxis dataKey="name" stroke="#64748b" tick={{fontSize: 11}} />
                          <YAxis stroke="#64748b" />
                          <Tooltip />
                          <Bar dataKey="buyDemand" fill="#10b981" radius={[4, 4, 0, 0]} name="Purchase Demand" />
                        </BarChart>
                      </ResponsiveContainer>
                    ) : <p className="text-slate-400">Loading charts...</p>}
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
                <div className="relative flex-1 w-full sm:max-w-md">
                  <i data-lucide="search" className="absolute left-3 top-2.5 h-4 w-4 text-slate-400"></i>
                  <input
                    type="text"
                    placeholder="Search products..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm"
                  />
                </div>

                <div className="flex items-center gap-3 w-full sm:w-auto">
                  <select
                    value={selectedCategory}
                    onChange={(e) => setSelectedCategory(e.target.value)}
                    className="bg-white border border-slate-200 text-sm rounded-lg px-3 py-2 outline-none shadow-sm focus:ring-2 focus:ring-indigo-500"
                  >
                    <option value="All">All Categories</option>
                    <option value="Textbooks">Textbooks</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Lab Supplies">Lab Supplies</option>
                    <option value="Essentials">Essentials</option>
                  </select>

                  <button
                    onClick={() => setShowModal(true)}
                    className="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition whitespace-nowrap"
                  >
                    <i data-lucide="plus" className="w-4 h-4"></i>
                    Post Item
                  </button>
                </div>
              </div>

              {filteredListings.length === 0 ? (
                <div className="text-center py-16 bg-white rounded-xl border border-slate-200">
                  <p className="text-slate-500">No items found matching your current filter.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredListings.map((item) => (
                    <div key={item.id} className="bg-white rounded-xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col">
                      <div className="relative h-48 w-full bg-slate-100">
                        <img src={item.image_url} alt={item.title} className="w-full h-full object-cover" />
                        {item.status === 'sold' && (
                          <div className="absolute inset-0 bg-black/60 flex items-center justify-center">
                            <span className="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full tracking-wider uppercase">SOLD</span>
                          </div>
                        )}
                        <button
                          onClick={() => toggleWishlist(item.id)}
                          className="absolute top-2 right-2 p-2 rounded-full bg-white/80 hover:bg-white text-slate-700 transition"
                        >
                          <i data-lucide="heart" className={`w-4 h-4 ${wishlist.includes(item.id) ? 'fill-rose-500 text-rose-500' : ''}`}></i>
                        </button>
                      </div>

                      <div className="p-5 flex-1 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-start mb-2">
                            <h3 className="font-semibold text-slate-800">{item.title}</h3>
                            <span className="font-bold text-indigo-600">${item.price.toFixed(2)}</span>
                          </div>
                          <p className="text-slate-600 text-xs line-clamp-2 mb-4">{item.description}</p>
                        </div>

                        <div className="flex items-center justify-between border-t border-slate-100 pt-3">
                          <span className="inline-flex items-center gap-1 text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
                            <i data-lucide="tag" className="w-3 h-3"></i>
                            {item.category}
                          </span>
                          <button
                            onClick={() => toggleStatus(item.id)}
                            className={`text-xs font-medium px-2.5 py-1 rounded transition flex items-center gap-1 ${
                              item.status === 'available' ? 'text-amber-700 bg-amber-50 hover:bg-amber-100' : 'text-emerald-700 bg-emerald-50 hover:bg-emerald-100'
                            }`}
                          >
                            <i data-lucide="check-circle-2" className="w-3 h-3"></i>
                            Mark {item.status === 'available' ? 'Sold' : 'Available'}
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {showModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-xl">
                <h2 className="text-lg font-bold mb-4">Post Campus Item</h2>
                <form onSubmit={handleAddListing} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-700 mb-1">Product Title</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g., Escape the Matrix"
                      value={formTitle}
                      onChange={(e) => setFormTitle(e.target.value)}
                      className="w-full border border-slate-200 rounded px-3 py-1.5 text-sm outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-700 mb-1">Category</label>
                      <select
                        value={formCategory}
                        onChange={(e) => setFormCategory(e.target.value)}
                        className="w-full border border-slate-200 rounded px-2 py-1.5 text-sm outline-none"
                      >
                        <option value="Textbooks">Textbooks</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Lab Supplies">Lab Supplies</option>
                        <option value="Essentials">Essentials</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-700 mb-1">Price ($)</label>
                      <input
                        type="number"
                        step="0.01"
                        required
                        placeholder="19.99"
                        value={formPrice}
                        onChange={(e) => setFormPrice(e.target.value)}
                        className="w-full border border-slate-200 rounded px-3 py-1.5 text-sm outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="text-xs font-medium text-slate-700">Description</label>
                      <button
                        type="button"
                        onClick={handleGenerateAI}
                        disabled={isGenerating}
                        className="text-xs text-indigo-600 hover:text-indigo-800 flex items-center gap-1 font-medium"
                      >
                        <i data-lucide="sparkles" className="w-3 h-3"></i>
                        {isGenerating ? 'Generating...' : 'Auto-Generate with AI'}
                      </button>
                    </div>
                    <textarea
                      rows={3}
                      required
                      value={formDesc}
                      onChange={(e) => setFormDesc(e.target.value)}
                      className="w-full border border-slate-200 rounded p-2 text-sm outline-none"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-4 py-1.5 text-sm text-slate-600 hover:bg-slate-100 rounded"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 text-sm bg-indigo-600 text-white rounded hover:bg-indigo-700"
                    >
                      Publish Listing
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
